# Every night: git-koi (MIT) draws my koi in all six bodies from my GitHub activity,
# then build.py puts them in the pond (one koi per 10 contributions) and commits it.
name: Koi

on:
  schedule:
    # Just after midnight UTC, so the koi shows the day that just ended.
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths: [build.py, .github/workflows/koi.yml]

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: yalongwastaken/git-koi@v1
        with: { body: white, output-dir: koi/white }
      - uses: yalongwastaken/git-koi@v1
        with: { body: black, output-dir: koi/black }
      - uses: yalongwastaken/git-koi@v1
        with: { body: asagi, output-dir: koi/asagi }
      - uses: yalongwastaken/git-koi@v1
        with: { body: tea, output-dir: koi/tea }
      - uses: yalongwastaken/git-koi@v1
        with: { body: gold, output-dir: koi/gold }
      - uses: yalongwastaken/git-koi@v1
        with: { body: platinum, output-dir: koi/platinum }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - name: Build the pond
        run: |
          pip install --quiet pillow
          python build.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit if anything changed
        shell: bash
        run: |
          git add koi/*/koi.gif assets
          if git diff --cached --quiet; then
            echo "Nothing changed; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's pond"
          git push --quiet
